<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Cosmic Route - Твой маршрут</title>
  <meta name="description" content="Без границ, без цензуры, без разрешения. Обходим блокировки и замедления.">
  <meta name="theme-color" content="#000000">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Cosmic Route">
  <meta property="og:description" content="Твой маршрут. Без границ, без цензуры, без разрешения.">
  <meta property="og:image" content="https://zhq.mom/logo-transparent.png">
  <meta property="og:url" content="https://zhq.mom">

  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" type="image/png" href="logo-transparent.png">
  <link rel="apple-touch-icon" href="logo-transparent.png">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cosmic Route">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-base: #000000;
      --accent-primary: #B14EFF;
      --accent-glow: #D070FF;
      --accent-deep: #6A1FB3;
      --text-primary: #FFFFFF;
      --text-secondary: rgba(255,255,255,0.65);
      --text-tertiary: rgba(255,255,255,0.4);
      --btn-bg: rgba(255,255,255,0.04);
      --btn-border: rgba(255,255,255,0.08);
      --btn-bg-hover: rgba(177,78,255,0.08);
      --btn-border-hover: rgba(177,78,255,0.3);
      color-scheme: dark;
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(ellipse at center, #1a0633 0%, #000000 70%);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.6) 100%);
      z-index: 1;
      pointer-events: none;
    }

    main {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: 3vh 1.5rem;
      text-align: center;
      gap: 0;
    }

    header.brand {
      margin-bottom: 0;
    }

    header.brand h1 {
      font-family: 'Orbitron', 'Courier New', monospace;
      font-weight: 700;
      font-size: clamp(2.4rem, 8.5vw, 5.5rem);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-primary);
      text-shadow: 0 0 30px rgba(177,78,255,0.4), 0 0 60px rgba(177,78,255,0.2);
      margin-bottom: 0.6rem;
    }

    .tagline {
      font-size: clamp(0.9rem, 2.5vw, 1.15rem);
      font-weight: 400;
      color: var(--text-primary);
      line-height: 1.5;
      text-shadow: 0 0 25px rgba(177,78,255,0.15), 0 0 50px rgba(177,78,255,0.08);
    }

    .value-props {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--accent-primary);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-top: 0.6rem;
      margin-bottom: 0.9rem;
      opacity: 0;
      animation: fadeUp 0.6s ease 0.1s forwards;
      text-shadow: 0 0 25px rgba(177,78,255,0.3), 0 0 60px rgba(177,78,255,0.15);
    }

    .buttons {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      width: 100%;
    }

    .cta-btn {
      display: flex;
      align-items: center;
      gap: 1rem;
      width: 100%;
      max-width: 420px;
      padding: 1.4rem 1.5rem;
      min-height: 82px;
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      border-radius: 16px;
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      opacity: 0;
      transform: translateY(10px);
      animation: fadeUp 0.6s ease forwards;
    }

    .cta-btn:nth-child(1) { animation-delay: 0.2s; }
    .cta-btn:nth-child(2) { animation-delay: 0.35s; }
    .cta-btn:nth-child(3) { animation-delay: 0.5s; }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .cta-btn:hover {
      background: var(--btn-bg-hover);
      border-color: var(--btn-border-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(177,78,255,0.15);
    }

    .cta-btn:active {
      transform: translateY(0);
    }

    .cta-btn:focus-visible {
      outline: 2px solid var(--accent-primary);
      outline-offset: 2px;
    }

    .cta-btn__icon {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      color: var(--accent-primary);
    }

    .cta-btn__icon svg {
      width: 100%;
      height: 100%;
    }

    .cta-btn__text {
      flex: 1;
      text-align: left;
    }

    .cta-btn__title {
      display: block;
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .cta-btn__subtitle {
      display: block;
      font-size: 0.95rem;
      font-weight: 400;
      color: var(--text-tertiary);
    }

    .cta-btn__arrow {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      color: var(--text-tertiary);
      transition: transform 0.3s ease, color 0.3s ease;
    }

    .cta-btn__arrow svg {
      width: 100%;
      height: 100%;
    }

    .cta-btn:hover .cta-btn__arrow {
      transform: translate(2px, -2px);
      color: var(--accent-primary);
    }

    .brand-mark {
      margin-top: 1rem;
      opacity: 0.7;
    }

    .brand-mark:hover {
      opacity: 0.9;
    }

    .brand-mark img {
      width: clamp(80px, 12vw, 130px);
      height: auto;
    }

    .copyright {
      font-size: 0.65rem;
      font-weight: 400;
      color: var(--text-tertiary);
      letter-spacing: 0.05em;
      margin-top: 0.6rem;
    }

    @media (min-width: 481px) {
      main {
        padding: 2rem;
      }
    }

    @media (min-width: 768px) {
      header.brand {
        margin-bottom: 0.75rem;
      }
    }

    @media (max-width: 480px) {
      main {
        padding-top: 8vh;
        padding-left: 1rem;
        padding-right: 1rem;
      }

      header.brand h1 {
        font-size: clamp(1.6rem, 8vw, 2.4rem);
        letter-spacing: 0.06em;
        margin-bottom: 0.6rem;
      }

      header.brand {
        margin-bottom: 1rem;
      }

      .tagline {
        font-size: 0.85rem;
        line-height: 1.4;
      }

      .value-props {
        font-size: 0.65rem;
        letter-spacing: 0.1em;
        margin-bottom: 0.75rem;
      }

      .buttons {
        gap: 0.5rem;
      }

      .cta-btn {
        padding: 1rem 1.1rem;
        min-height: 64px;
        border-radius: 12px;
      }

      .cta-btn__title {
        font-size: 1.05rem;
      }

      .cta-btn__subtitle {
        font-size: 0.8rem;
      }

      .brand-mark img {
        width: 70px;
      }

      .copyright {
        font-size: 0.55rem;
      }
    }

    @media (max-height: 667px) {
      main {
        padding-top: 4vh;
      }

      header.brand {
        margin-bottom: 0.75rem;
      }

      header.brand h1 {
        font-size: 1.5rem;
        margin-bottom: 0.4rem;
      }

      .value-props {
        margin-bottom: 0.5rem;
      }

      .cta-btn {
        min-height: 56px;
        padding: 0.8rem 1rem;
      }

      .brand-mark {
        margin-top: 0.75rem;
      }

      .brand-mark img {
        width: 60px;
      }
    }

    /* Starfield */
    .starfield {
      position: fixed;
      inset: 0;
      z-index: 2;
      overflow: hidden;
      pointer-events: none;
      --drift-cos: 0.8829;
      --drift-sin: -0.4695;
      --drift-distance: 110vmin;
    }

    .starfield-star {
      position: absolute;
      transform: translate(-50%, -50%);
    }

    .starfield-star-inner {
      width: 200px;
      height: 200px;
      animation: starfield-drift var(--drift-duration, 24s) linear var(--drift-delay, 0s) infinite;
      will-change: transform, opacity;
    }

    @keyframes starfield-drift {
      0% {
        transform: translate3d(0, 0, 0) scale(var(--star-scale, 1));
        opacity: 0;
      }
      12% {
        opacity: var(--star-opacity-peak, 0.35);
      }
      88% {
        opacity: var(--star-opacity-peak, 0.35);
      }
      100% {
        transform: translate3d(
          calc(var(--drift-cos) * var(--drift-distance)),
          calc(var(--drift-sin) * var(--drift-distance)),
          0
        ) scale(var(--star-scale, 1));
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
      .cta-btn { opacity: 1; transform: none; }
      .starfield-star-inner { animation: none; opacity: 0.25; }
    }

    /* Redirect overlay */
    .redirect-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .redirect-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .redirect-text {
      font-family: 'Inter', sans-serif;
      font-size: clamp(1.1rem, 3.5vw, 1.5rem);
      font-weight: 600;
      color: rgba(255,255,255,0.5);
      text-align: center;
      margin-bottom: 3rem;
      padding: 0 2rem;
      line-height: 1.5;
      text-shadow: 0 0 20px rgba(177,78,255,0.2);
    }

    .redirect-circle {
      position: relative;
      width: 150px;
      height: 150px;
    }

    .redirect-circle svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .redirect-circle-bg {
      fill: none;
      stroke: rgba(177,78,255,0.15);
      stroke-width: 2;
    }

    .redirect-circle-progress {
      fill: none;
      stroke: var(--accent-primary);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-dasharray: 408.4;
      stroke-dashoffset: 408.4;
      filter: drop-shadow(0 0 8px rgba(177,78,255,0.6));
      transition: stroke-dashoffset 1s linear;
    }

    .redirect-number {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Orbitron', monospace;
      font-size: 3.5rem;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 0 30px rgba(177,78,255,0.5), 0 0 60px rgba(177,78,255,0.25);
    }
  </style>
</head>

  <div class="vignette" aria-hidden="true"></div>
  <div class="starfield" id="starfield" aria-hidden="true"></div>

  <div class="redirect-overlay" id="redirectOverlay">
    <div class="redirect-text" id="redirectText"></div>
    <div class="redirect-circle">
      <svg viewBox="0 0 140 140">
        <circle class="redirect-circle-bg" cx="70" cy="70" r="65"/>
        <circle class="redirect-circle-progress" id="redirectProgress" cx="70" cy="70" r="65"/>
      </svg>
      <div class="redirect-number" id="redirectNumber">3</div>
    </div>
  </div>

          </svg>

      <a class="cta-btn" data-r="2" role="link" aria-label="Поддержка — Создать тикет">

          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">

          </svg>
        </div>
        <div class="cta-btn__text">
          <span class="cta-btn__title">Служба поддержки</span>
          <span class="cta-btn__subtitle">Если вдруг случился сбой на маршруте</span>

          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">

    </nav>

  <script>
    (function() {
      var container = document.getElementById('starfield');
      var count = 35;

      function rand(min, max) {
        return min + Math.random() * (max - min);
      }

      function clamp(v, lo, hi) {
        return Math.min(hi, Math.max(lo, v));
      }

      function createStarSVG(id) {
        var filterId = 'sf-' + id;
        var gradientId = 'sg-' + id;
        return '<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:block;width:100%;height:100%" aria-hidden="true">' +
          '<path d="M15.0177 224.328L209.31 30.0354" stroke="url(#' + gradientId + ')" stroke-width="2" stroke-linecap="round"/>' +
          '<g filter="url(#' + filterId + ')">' +
            '<path d="M216.297 15.0182L216.495 27.0882L224.596 36.4474L212.219 36.2792L202.859 43.9028L202.661 31.8328L194.56 22.4735L206.937 22.6417L216.297 15.0182Z" fill="white"/>' +
          '</g>' +
          '<defs>' +
            '<filter id="' + filterId + '" x="186.56" y="7.01807" width="46.0352" height="44.8848" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceGraphic" stdDeviation="1.25"/></filter>' +
            '<linearGradient id="' + gradientId + '" x1="209.664" y1="30.389" x2="15.3713" y2="224.681" gradientUnits="userSpaceOnUse"><stop stop-color="white"/><stop offset="1" stop-color="white" stop-opacity="0"/></linearGradient>' +
          '</defs>' +
        '</svg>';
      }

      for (var i = 0; i < count; i++) {
        var scale = clamp(rand(0.16, 0.36), 0.06, 2.5);
        var opacityPeak = rand(0.14, 0.48);
        var duration = rand(12, 48);
        var delay = -rand(0, 55);
        var left = rand(-20, 90);
        var top = rand(80, 120);

        var outer = document.createElement('div');
        outer.className = 'starfield-star';
        outer.style.left = left + '%';
        outer.style.top = top + '%';

        var inner = document.createElement('div');
        inner.className = 'starfield-star-inner';
        inner.style.setProperty('--star-scale', scale);
        inner.style.setProperty('--star-opacity-peak', opacityPeak);
        inner.style.setProperty('--drift-duration', duration + 's');
        inner.style.setProperty('--drift-delay', delay + 's');
        inner.innerHTML = createStarSVG(i);

        outer.appendChild(inner);
        container.appendChild(outer);
      }
    })();
  </script>

  <script>
    (function(){
      var d=[atob('aHR0cHM6Ly9jb3NtaWNyb3V0ZS5zaG9w'),atob('aHR0cHM6Ly90Lm1lL0Nvc21pY1JvdXRlVlBO'),atob('aHR0cHM6Ly90Lm1lL0Nvc21pY3JvdXRldGlja2V0c19ib3Q=')];
      var m=['Вы уже на полпути к свободному интернету!\nЕщё чуть-чуть!','Настраиваем частоту свободы...\nПочти готово!','Переводим вас на связь с экипажем!'];
      var overlay=document.getElementById('redirectOverlay');
      var progress=document.getElementById('redirectProgress');
      var numEl=document.getElementById('redirectNumber');
      var textEl=document.getElementById('redirectText');
      var circumference=2*Math.PI*65;
      var busy=false;

      function doRedirect(url,msg){
        if(busy)return;
        busy=true;
        var count=3;
        numEl.textContent=count;
        textEl.innerHTML=msg.replace('\n','<br>');
        progress.style.transition='none';
        progress.style.strokeDashoffset=circumference;
        overlay.classList.add('active');

        setTimeout(function tick(){
          progress.style.transition='stroke-dashoffset 1s linear';
          progress.style.strokeDashoffset=circumference*(1-((4-count)/3));
          if(count<=0){
            window.location.href=url;
            return;
          }
          numEl.textContent=count;
          count--;
          setTimeout(tick,1000);
        },100);
      }

      document.querySelectorAll('.cta-btn[data-r]').forEach(function(el){
        el.style.cursor='pointer';
        el.addEventListener('click',function(e){
          e.preventDefault();
          var i=+el.getAttribute('data-r');
          doRedirect(d[i],m[i]);
        });
      });
    })();
  </script>
